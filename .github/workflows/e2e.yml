# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven
name: Build e2e tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-e2e-tests:
    runs-on: k8s-runner-e2e

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: plugin
          persist-credentials: false

      - name: Set up JDK 11
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '11'
          overwrite-settings: false

      - name: Checkout e2e test repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: cdapio/cdap-e2e-tests
          path: e2e
          persist-credentials: false

      - name: Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ github.workflow }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ github.workflow }}

      - name: Run tests
        run: python3 e2e/src/main/scripts/run_e2e_test.py

      - name: Upload debug files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: Debug files
          path: ./**/target/e2e-debug

      - name: Upload reports to GCS
        uses: google-github-actions/upload-cloud-storage@c0f6160ff80057923ff50e5e567695cea181ec23 # v2
        if: always()
        with:
          path: ./plugin/target/cucumber-reports
          destination: e2e-tests-cucumber-reports/${{ github.event.repository.name }}/${{ github.ref }}

      - name: Cucumber Report URL
        if: always()
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          GITHUB_REF: ${{ github.ref }}
        run: echo "https://storage.googleapis.com/e2e-tests-cucumber-reports/${REPO_NAME}/${GITHUB_REF}/cucumber-reports/advanced-reports/cucumber-html-reports/overview-features.html"
